{% extends 'base.html' %}{% block title %}Record event{% endblock %}{% block content %}<h1>Record gallery event</h1>
<p>Enter the gallery before a room. Leave the current room before entering another or leaving the gallery.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="expected_version" value="{{ version }}">
<label>Person <select name="person_id" required>{% for person in people %}<option value="{{ person.id }}">{{ person.id }} — {{ person.name }} ({{ person.kind }})</option>{% endfor %}</select></label>
<label>Event <select name="event_type">{% for event_type in types %}<option>{{ event_type }}</option>{% endfor %}</select></label>
<label>Room <select name="room_id"><option value="">No room — for gallery entry or exit</option>{% for room in rooms %}<option value="{{ room.id }}">{{ room.name }}</option>{% endfor %}</select></label><button>Record event</button></form>{% endblock %}
